name: Android Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Laborbook APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/*.apk build_output/Laborbook.apk

      - name: Upload Laborbook APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laborbook-APK
          path: build_output/Laborbook.apk
          retention-days: 30
