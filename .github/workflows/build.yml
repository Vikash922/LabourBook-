name: Android Build & Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Laborbook APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          validate-wrappers: false

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/debug/*.apk build_output/Laborbook.apk

      - name: Upload Laborbook APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laborbook-APK
          path: build_output/Laborbook.apk
          retention-days: 30
